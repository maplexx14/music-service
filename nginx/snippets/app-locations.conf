# Locations приложения: API, стрим, статика. Подключается ИЗ server-блока
# (см. app.conf.template) — и в http-only варианте на время выпуска
# сертификата, и в основном TLS-варианте. Один файл на оба, чтобы правила
# не разъезжались между ними.
#
# Требует определённых на http-уровне $cors_origin, $forwarded_proto,
# $connection_upgrade и upstream'ов backend_upstream / frontend_upstream.
#
# ВАЖНО: любой proxy_set_header внутри location отменяет наследование ВСЕХ
# proxy_set_header, заданных выше по дереву. Поэтому в каждом location,
# который ставит хоть один заголовок, продублирован полный набор.

# API бэкенда.
location /api/ {
    # CORS preflight: браузер шлёт OPTIONS до кросс-origin запроса
    # (в т.ч. <audio> с Range-запросами). Отвечаем здесь, не проксируя
    # на бэкенд — быстрее и надёжнее.
    if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin'  $cors_origin always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Range, Origin, Accept, X-Device-Token' always;
        add_header 'Access-Control-Max-Age'       1728000 always;
        add_header 'Content-Type'                 'text/plain; charset=utf-8';
        add_header 'Content-Length'                0;
        return 204;
    }
    proxy_pass http://backend_upstream;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Connection        "";
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    # CORS: скрываем все CORS-заголовки бэкенда (CORSMiddleware может вернуть
    # "*", дублировать Allow-Headers и т.п.) и ставим единый набор.
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Expose-Headers;
    proxy_hide_header Access-Control-Allow-Credentials;
    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, Range, Origin, Accept, X-Device-Token" always;
    add_header Access-Control-Expose-Headers "Content-Range, Content-Length, Accept-Ranges, X-Total-Count, Content-Type" always;
    add_header Vary "Origin" always;
}

# Персональный поток — НЕ кэшируем. Точное совпадение (=) приоритетнее
# префиксного /api/recommendations ниже, иначе поток попадал под его
# max-age=60: браузер отдавал ту же выдачу из disk cache, запрос не доходил
# до бэкенда, и каждый запуск проигрывал одну и ту же цепочку треков.
# Ротация артистов и серверная история (flow:history) при этом не работали.
#
# Дубль nginx.conf — этот файл идёт в prod-стадию образа, тот в dev (см.
# nginx/Dockerfile). Правки нужны в ОБОИХ: расхождение уже один раз вернуло
# этот баг в dev, где фикса не было.
location = /api/recommendations/flow {
    if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin'  $cors_origin always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Range, Origin, Accept, X-Device-Token' always;
        add_header 'Access-Control-Max-Age'       1728000 always;
        add_header 'Content-Type'                 'text/plain; charset=utf-8';
        add_header 'Content-Length'                0;
        return 204;
    }
    proxy_pass http://backend_upstream;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Connection        "";
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_hide_header Cache-Control;
    proxy_hide_header Access-Control-Allow-Origin;
    add_header Cache-Control "no-store" always;
    add_header Access-Control-Allow-Origin $cors_origin always;
}

# Кэширование рекомендаций.
location /api/recommendations {
    if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin'  $cors_origin always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Range, Origin, Accept, X-Device-Token' always;
        add_header 'Access-Control-Max-Age'       1728000 always;
        add_header 'Content-Type'                 'text/plain; charset=utf-8';
        add_header 'Content-Length'                0;
        return 204;
    }
    proxy_pass http://backend_upstream;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Connection        "";
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_hide_header Cache-Control;
    proxy_hide_header Access-Control-Allow-Origin;
    add_header Cache-Control "private, max-age=60";
    add_header Access-Control-Allow-Origin $cors_origin always;
}

# Кэширование поиска.
location /api/search {
    if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin'  $cors_origin always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Range, Origin, Accept, X-Device-Token' always;
        add_header 'Access-Control-Max-Age'       1728000 always;
        add_header 'Content-Type'                 'text/plain; charset=utf-8';
        add_header 'Content-Length'                0;
        return 204;
    }
    proxy_pass http://backend_upstream;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Connection        "";
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_hide_header Cache-Control;
    proxy_hide_header Access-Control-Allow-Origin;
    add_header Cache-Control "private, max-age=120";
    add_header Access-Control-Allow-Origin $cors_origin always;
}

# Директ-отдача музыки/обложек (фоллбэк для старых path, до переезда в MinIO).
location /music_files/ {
    if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin'  $cors_origin always;
        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Range, Origin, Accept' always;
        add_header 'Access-Control-Max-Age'       1728000 always;
        return 204;
    }
    proxy_pass http://backend_upstream;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    add_header Access-Control-Allow-Origin $cors_origin always;
}

location /cover_files/ {
    if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin'  $cors_origin always;
        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Origin, Accept' always;
        add_header 'Access-Control-Max-Age'       1728000 always;
        return 204;
    }
    proxy_pass http://backend_upstream;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Cache-Control "public, max-age=2592000, immutable";
}

# Фронтенд-бандлы (JS, CSS) — кэшируем на год. Vite даёт им хэш в имени,
# поэтому immutable безопасен: новый билд = новое имя файла.
location ~* \.(?:js|css)$ {
    proxy_pass http://frontend_upstream;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    # Глушим Accept-Encoding в сторону фронтенда, иначе его внутренний nginx
    # отдаёт gzip — а сжатый ответ фильтры сжатия пропускают, и brotli этого
    # сервера (на ~15-20% плотнее gzip) не применялся к бандлам НИКОГДА.
    # Внутренний слой пусть отдаёт как есть, жмём здесь и один раз.
    # Сжатие берёт Accept-Encoding исходного запроса клиента, а не этот.
    proxy_set_header Accept-Encoding "";
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# config.js генерируется на старте из переменных окружения и НЕ хэширован —
# закэшировав его надолго, мы бы залипли на старом API URL после смены env.
# Правило выше по JS-расширению его бы поймало, поэтому точное совпадение (=)
# перехватывает раньше.
location = /config.js {
    proxy_pass http://frontend_upstream;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    add_header Cache-Control "no-store" always;
}

# Фронтенд-корень: SPA отдаёт index.html на все остальные пути.
location / {
    proxy_pass http://frontend_upstream;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
}
