# http-level часть прод-конфига: maps и upstreams.
#
# Лежит прямо в conf.d/, поэтому подключается автоматически (nginx.conf
# базового образа делает `include /etc/nginx/conf.d/*.conf` внутри http-блока).
# Имя с префиксом 00- гарантирует загрузку до app.conf, который ссылается на
# определённые здесь upstream'ы и переменные.
#
# Дев-аналог этих директив живёт в ../nginx.conf — при правке синхронизируйте.

# Разрешаем WebSocket upgrade. При обычных запросах (без Upgrade-заголовка)
# отдаём keep-alive — иначе $connection_upgrade даёт "close" и streaming-
# соединения рвутся при каждой паузе буферизации.
map $http_upgrade $connection_upgrade {
    default keep-alive;
    websocket upgrade;
}

# За TLS-терминацией на самом nginx схема известна из $scheme, но конфиг
# должен работать и когда впереди стоит внешний прокси (Cloudflare), который
# присылает исходную схему в X-Forwarded-Proto.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# CORS: эхо Origin обратно клиенту. Если Origin не передан (same-origin запрос),
# подставляем * — браузер не проверяет CORS для same-origin, а cross-origin
# запросы всегда несут Origin.
map $http_origin $cors_origin {
    default $http_origin;
    ''      '*';
}

# Потолок скорости отдачи аудио (после первой порции ответа, $audio_burst, см.
# limit_rate_after в location /api/ и /music_files/). Safari MP4 — не меньше
# 2 МБ: перед стартом MP4 он выкачивает ~1 МБ и больше, и с порогом 512 КБ
# старт MP4-треков вырос до 3-23 с (замер в Safari 2026-10-03). Зачем: все запросы
# PWA к нам идут ОДНИМ HTTP/2-соединением, а Safari тянет файл трека целиком
# на всей скорости канала, да ещё и прогрев следующего трека. Мегабайты тела
# встают в TCP-буферы, и любой новый запрос — пробный Range нового трека,
# API — ждёт за ними в очереди. Лог устройства 2026-10-03: fetch /api/health
# по тому же соединению 2.7-7.3 с при 2-20 мс на бэкенде, старт трека 4-28 с.
# Отменённый (пропущенный) трек при этом ещё секунды доезжает из буферов.
# С потолком ниже ширины канала очередь не копится. Сжатому аудио (AAC/Opus/
# MP3 ~16-20 КБ/с) 64 КБ/с — четырёхкратный запас: трек 3.5 мин докачивается
# за ~50 с. Было 160 КБ/с, но вместе с прогревом следующего трека это два
# потока по 1.3 Мбит/с, и на узком канале (LTE, раздача с телефона) у игр
# рядом с плеером скакал пинг и терялись пакеты (жалобы 2026-10-22). Несжатое
# и lossless (FLAC ~125 КБ/с, WAV ~176 КБ/с) бывает на любом из путей — в
# MinIO такие лежат и под external/ytmusic — им 512 КБ/с, иначе заикание.
# Тип берём у апстрима, как и в $audio_burst ниже. 0 — без ограничения.
# ВАЖНО: limit_rate действует только на буферизованное проксирование, а в
# location /api/ стоит proxy_buffering off — аудио-ответы бэкенд помечает
# X-Accel-Buffering: yes (AudioBufferingMiddleware в backend/app/main.py).
map "$upstream_http_content_type:$uri" $audio_limit_rate {
    ~*^audio/(x-)?(flac|wav|wave):        512k;
    ~^[^:]*:/api/soulseek/stream/         512k;
    ~^[^:]*:/music_files/                 512k;
    ~^[^:]*:/api/[a-z]+/stream/           64k;
    ~^[^:]*:/api/tracks/\d+/stream$       64k;
    default                               0;
}

# Сколько первых байт ответа идёт без потолка скорости. MP4 Safari перед
# стартом выкачивает ~1 МБ+ (с порогом 512 КБ старт MP4 был 3-23 с) — ему 2 МБ.
# Всем остальным 256 КБ: MP3 и ADTS (?fmt=adts, iOS) играют с первых
# килобайт, Chrome стартует MP4 с 256 КБ так же быстро, как с 2 МБ (замер
# 2026-10-22, холодный старт 0.4-1.5 с в обоих вариантах). Каждый лишний
# мегабайт «залпа» идёт на полной скорости канала: забивает общее HTTP/2-
# соединение (fetch /api/health с телефона 2.5-15 с при 2 МБ, лог 2026-10-03)
# и очередь роутера — пинг соседних игр скачет на старте каждого трека, а
# пропуск трека через 3 с стоил ~3 МБ (замер 2026-10-22).
#
# Тип ответа берём у апстрима: limit_rate_after вычисляется на первой записи
# тела, когда заголовки бэкенда уже получены (проверено на nginx 1.27.5).
# Safari по UA: Chrome, Firefox, Edge и Android-браузеры тоже пишут «Safari/»,
# поэтому сначала отсекаем их.
map $http_user_agent $ua_safari {
    ~Chrome|Chromium|CriOS|FxiOS|EdgiOS|Edg/|OPR/|Android  0;
    ~Safari/                                               1;
    default                                                0;
}

map "$ua_safari:$upstream_http_content_type" $audio_burst {
    ~^1:(audio|video)/mp4   2m;
    default                 256k;
}



upstream frontend_upstream {
    server frontend:3000;
    keepalive 16;
}

# Disk-кэш внешних обложек (location = /api/tracks/cover-proxy в
# snippets/app-locations.conf). Обложки приходят через прокси-выход за сотни
# мс и при этом иммутабельны — отдаём повторные из кэша nginx, не будя бэкенд.
# 256m ≈ 100k+ обложек по ~2.5KB (инактивность 2 суток чистит холодные).
proxy_cache_path /var/cache/nginx/covers levels=1:2 keys_zone=covers:16m
    max_size=256m inactive=48h use_temp_path=off;

# Disk-кэш поиска (location /api/search и /api/search/external). Redis уже
# держит выдачу, но каждый запрос всё равно проходит через Python: роутинг,
# зависимости, pydantic. Здесь повторный запрос отвечает сам nginx, бэкенд
# не будится. Ответы мелкие (десятки КБ), 64m хватает на тысячи запросов.
proxy_cache_path /var/cache/nginx/search levels=1:2 keys_zone=search:8m
    max_size=64m inactive=10m use_temp_path=off;

upstream backend_upstream {
    server backend:8000;
    # Персистентные соединения к бэкенду: 256 вместо 32 под 10k конкурентных
    # запросов. nginx переиспользует одно соединение для многих клиентов (на
    # client держит десятки тысяч, на upstream — сотни). С HTTP/1.1 keepalive
    # это безопасно и убирает 3-way handshake на каждом запросе.
    keepalive 256;
    keepalive_requests 1000;
    # nginx обязан закрывать простаивающие соединения к бэкенду РАНЬШЕ, чем это
    # сделает gunicorn/uvicorn (его --timeout-keep-alive по умолчанию 5s). Иначе
    # nginx переиспользует сокет, который uvicorn только что закрыл, получает
    # "recv() failed (104: Connection reset by peer)" и отдаёт клиенту 502.
    # <audio> на такой 502 переспрашивает трек с нуля — серия ретраев по
    # несколько секунд каждый, и старт 3:30-трека растягивался на ~25 секунд.
    keepalive_timeout 4s;
}
