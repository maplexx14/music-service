# Reverse proxy, объединяющий фронтенд и бэкенд под одним origin.
# Позволяет пробросить сервис одним туннелем (ngrok http 80) и открывать
# его с других устройств: фронтенд сам берёт API по window.location.origin + /api.

# Разрешаем WebSocket upgrade (Vite HMR + возможные ws у бэкенда).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ngrok терминирует TLS и ходит к nginx по http, но присылает исходную схему
# в X-Forwarded-Proto. Пробрасываем её дальше (иначе бэкенд строит http-редиректы
# и ломается https → mixed content). Локальный доступ без заголовка → $scheme.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

upstream frontend_upstream {
    server frontend:3000;
}

upstream backend_upstream {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    # Загрузка треков может быть большой — снимаем ограничение по размеру тела.
    client_max_body_size 1024m;

    # Общие заголовки проксирования.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # API бэкенда.
    location /api/ {
        proxy_pass http://backend_upstream;
        # Стриминг/долгие запросы (скачивание, поиск) не буферизуем.
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Статика бэкенда: аудиофайлы (с Range-запросами) и обложки.
    location /music_files/ {
        proxy_pass http://backend_upstream;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location /cover_files/ {
        proxy_pass http://backend_upstream;
    }

    # Всё остальное — Vite dev server фронтенда (включая HMR WebSocket).
    location / {
        proxy_pass http://frontend_upstream;
        proxy_read_timeout 3600s;
    }
}
