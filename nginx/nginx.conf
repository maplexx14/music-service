# Reverse proxy, объединяющий фронтенд и бэкенд под одним origin.
# Позволяет пробросить сервис одним туннелем (ngrok http 80) и открывать
# его с других устройств: фронтенд сам берёт API по window.location.origin + /api.

# Разрешаем WebSocket upgrade. При обычных запросах (без Upgrade-заголовка)
# отдаём keep-alive — иначе $connection_upgrade даёт "close" и streaming-
# соединения рвутся при каждой паузе буферизации.
map $http_upgrade $connection_upgrade {
    default keep-alive;
    websocket upgrade;
}

# ngrok терминирует TLS и ходит к nginx по http, но присылает исходную схему
# в X-Forwarded-Proto. Пробрасываем её дальше (иначе бэкенд строит http-редиректы
# и ломается https → mixed content). Локальный доступ без заголовка → $scheme.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# CORS: эхо Origin обратно клиенту. Если Origin не передан (same-origin запрос),
# подставляем * — браузер не проверяет CORS для same-origin, а cross-origin
# запросы всегда несут Origin.
map $http_origin $cors_origin {
    default $http_origin;
    ''      '*';
}

upstream frontend_upstream {
    server frontend:3000;
    keepalive 16;
}

upstream backend_upstream {
    server backend:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 1024m;
    # Долгий keepalive: аудио-стримы длятся минутами через tunnel.
    # По умолчанию 75s — может быть мало.
    keepalive_timeout 3600s;

    gzip on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types application/json application/javascript text/javascript application/xml text/xml text/css text/plain image/svg+xml application/manifest+json;

    # Общие заголовки проксирования.
    # ВАЖНО: любой proxy_set_header внутри location отменяет наследование
    # ВСЕХ этих директив — в таких location полный набор продублирован.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    # По умолчанию keep-alive; при WebSocket-запросе upgrade переключает на
    # "upgrade". Ранее было $connection_upgrade, который при обычных запросах
    # давал "close" и ронял streaming-соединения.
    proxy_set_header Connection $connection_upgrade;
    # TCP keepalive: предотвращает обрыв idle-соединений промежуточными
    # слоями (tunnel, NAT, файрволы) во время пауз буферизации.
    proxy_socket_keepalive on;

    # API бэкенда.
    location /api/ {
        # CORS preflight: браузер шлёт OPTIONS до кросс-орIGIN запроса
        # (в т.ч. <audio> с Range-запросами). Отвечаем здесь, не проксируя
        # на бэкенд — быстрее и надёжнее.
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin'  $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Range, Origin, Accept, tuna-skip-browser-warning, ngrok-skip-browser-warning' always;
            add_header 'Access-Control-Max-Age'       1728000 always;
            add_header 'Content-Type'                 'text/plain; charset=utf-8';
            add_header 'Content-Length'                0;
            return 204;
        }
        proxy_pass http://backend_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Connection        "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # CORS: скрываем все CORS-заголовки бэкена (CORSMiddleware может вернуть
        # "*", дублировать Allow-Headers и т.п.) и ставим единый набор.
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Expose-Headers;
        proxy_hide_header Access-Control-Allow-Credentials;
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Range, Origin, Accept, tuna-skip-browser-warning, ngrok-skip-browser-warning" always;
        add_header Access-Control-Expose-Headers "Content-Range, Content-Length, Accept-Ranges, X-Total-Count, Content-Type" always;
        add_header Vary "Origin" always;
    }

    # Кэширование рекомендаций.
    location /api/recommendations {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin'  $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Range, Origin, Accept, tuna-skip-browser-warning, ngrok-skip-browser-warning' always;
            add_header 'Access-Control-Max-Age'       1728000 always;
            add_header 'Content-Type'                 'text/plain; charset=utf-8';
            add_header 'Content-Length'                0;
            return 204;
        }
        proxy_pass http://backend_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Connection        "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_hide_header Cache-Control;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Cache-Control "private, max-age=60";
        add_header Access-Control-Allow-Origin $cors_origin always;
    }

    # Кэширование поиска.
    location /api/search {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin'  $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Range, Origin, Accept, tuna-skip-browser-warning, ngrok-skip-browser-warning' always;
            add_header 'Access-Control-Max-Age'       1728000 always;
            add_header 'Content-Type'                 'text/plain; charset=utf-8';
            add_header 'Content-Length'                0;
            return 204;
        }
        proxy_pass http://backend_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Connection        "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_hide_header Cache-Control;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Cache-Control "private, max-age=30";
        add_header Access-Control-Allow-Origin $cors_origin always;
    }

    # Статика бэкенда: аудиофайлы (с Range-запросами) и обложки.
    location /music_files/ {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin'  $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Range, Origin, Accept, tuna-skip-browser-warning, ngrok-skip-browser-warning' always;
            add_header 'Access-Control-Max-Age'       1728000 always;
            add_header 'Content-Type'                 'text/plain; charset=utf-8';
            add_header 'Content-Length'                0;
            return 204;
        }
        proxy_pass http://backend_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Connection        "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_hide_header Cache-Control;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Cache-Control "public, max-age=604800";
        add_header Access-Control-Allow-Origin $cors_origin always;
    }

    location /cover_files/ {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin'  $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Range, Origin, Accept, tuna-skip-browser-warning, ngrok-skip-browser-warning' always;
            add_header 'Access-Control-Max-Age'       1728000 always;
            add_header 'Content-Type'                 'text/plain; charset=utf-8';
            add_header 'Content-Length'                0;
            return 204;
        }
        proxy_pass http://backend_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Connection        "";
        proxy_hide_header Cache-Control;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Cache-Control "public, max-age=604800";
        add_header Access-Control-Allow-Origin $cors_origin always;
    }

    # Всё остальное — Vite dev server фронтенда (включая HMR WebSocket).
    location / {
        proxy_pass http://frontend_upstream;
        proxy_read_timeout 3600s;
    }
}
