# Reverse proxy, объединяющий фронтенд и бэкенд под одним origin.
# Позволяет пробросить сервис одним туннелем (ngrok http 80) и открывать
# его с других устройств: фронтенд сам берёт API по window.location.origin + /api.

# NB: этот файл копируется в /etc/nginx/conf.d/default.conf, т.е. включается
# ВНУТРЬ http-блока. Директивы уровня main/events (worker_connections,
# worker_rlimit_nofile) здесь синтаксически невалидны — они правятся в
# /etc/nginx/nginx.conf из Dockerfile (см. sed там).

# Разрешаем WebSocket upgrade. При обычных запросах (без Upgrade-заголовка)
# отдаём keep-alive — иначе $connection_upgrade даёт "close" и streaming-
# соединения рвутся при каждой паузе буферизации.
map $http_upgrade $connection_upgrade {
    default keep-alive;
    websocket upgrade;
}

# ngrok терминирует TLS и ходит к nginx по http, но присылает исходную схему
# в X-Forwarded-Proto. Пробрасываем её дальше (иначе бэкенд строит http-редиректы
# и ломается https → mixed content). Локальный доступ без заголовка → $scheme.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# CORS: эхо Origin обратно клиенту. Если Origin не передан (same-origin запрос),
# подставляем * — браузер не проверяет CORS для same-origin, а cross-origin
# запросы всегда несут Origin.
map $http_origin $cors_origin {
    default $http_origin;
    ''      '*';
}

upstream frontend_upstream {
    server frontend:3000;
    keepalive 16;
}

upstream backend_upstream {
    server backend:8000;
    # Персистентные соединения к бэкенду: 256 вместо 32 под 10k конкурентных
    # запросов. nginx переиспользует одно соединение для многих клиентов (на
    # client держит десятки тысяч, на upstream — сотни). С HTTP/1.1 keepalive
    # это безопасно и убирает 3-way handshake на каждом запросе.
    keepalive 256;
    keepalive_requests 1000;
    # nginx обязан закрывать простаивающие соединения к бэкенду РАНЬШЕ, чем это
    # сделает uvicorn (его --timeout-keep-alive по умолчанию 5s). Иначе nginx
    # переиспользует сокет, который uvicorn только что закрыл, получает
    # "recv() failed (104: Connection reset by peer)" и отдаёт клиенту 502.
    # <audio> на такой 502 переспрашивает трек с нуля — серия ретраев по
    # несколько секунд каждый, и старт 3:30-трека растягивался на ~25 секунд.
    keepalive_timeout 4s;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 1024m;
    # Долгий keepalive: аудио-стримы длятся минутами через tunnel.
    # По умолчанию 75s — может быть мало.
    keepalive_timeout 3600s;

    # Кэш файловых дескрипторов: ускоряет TTFB для статических файлов,
    # которые уже открывались (JS/CSS-чанки, обложки).
    open_file_cache max=1000 inactive=60s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    gzip on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types application/json application/javascript text/javascript application/xml text/xml text/css text/plain image/svg+xml application/manifest+json;

    # Brotli: ~20-30% лучше сжатие чем gzip для текстовых ресурсов.
    # brotli_static раздаёт предкомпрессированные .br файлы если есть.
    brotli on;
    brotli_comp_level 6;
    brotli_min_length 1024;
    brotli_types application/json application/javascript text/javascript application/xml text/xml text/css text/plain image/svg+xml application/manifest+json;
    brotli_static on;

    # Общие заголовки проксирования.
    # ВАЖНО: любой proxy_set_header внутри location отменяет наследование
    # ВСЕХ этих директив — в таких location полный набор продублирован.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    # По умолчанию keep-alive; при WebSocket-запросе upgrade переключает на
    # "upgrade". Ранее было $connection_upgrade, который при обычных запросах
    # давал "close" и ронял streaming-соединения.
    proxy_set_header Connection $connection_upgrade;
    # TCP keepalive: предотвращает обрыв idle-соединений промежуточными
    # слоями (tunnel, NAT, файрволы) во время пауз буферизации.
    proxy_socket_keepalive on;

    # API бэкенда.
    location /api/ {
        # CORS preflight: браузер шлёт OPTIONS до кросс-орIGIN запроса
        # (в т.ч. <audio> с Range-запросами). Отвечаем здесь, не проксируя
        # на бэкенд — быстрее и надёжнее.
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin'  $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Range, Origin, Accept, tuna-skip-browser-warning, ngrok-skip-browser-warning' always;
            add_header 'Access-Control-Max-Age'       1728000 always;
            add_header 'Content-Type'                 'text/plain; charset=utf-8';
            add_header 'Content-Length'                0;
            return 204;
        }
        proxy_pass http://backend_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Connection        "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # CORS: скрываем все CORS-заголовки бэкена (CORSMiddleware может вернуть
        # "*", дублировать Allow-Headers и т.п.) и ставим единый набор.
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Expose-Headers;
        proxy_hide_header Access-Control-Allow-Credentials;
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Range, Origin, Accept, tuna-skip-browser-warning, ngrok-skip-browser-warning" always;
        add_header Access-Control-Expose-Headers "Content-Range, Content-Length, Accept-Ranges, X-Total-Count, Content-Type" always;
        add_header Vary "Origin" always;
    }

    # Персональный поток — НЕ кэшируем. Точное совпадение (=) приоритетнее
    # префиксного /api/recommendations ниже, иначе поток попадал под его
    # max-age=60: браузер отдавал ту же выдачу из disk cache, запрос не доходил
    # до бэкенда, и каждый запуск проигрывал одну и ту же цепочку треков.
    # Ротация артистов и серверная история (flow:history) при этом не работали.
    #
    # Дубль snippets/app-locations.conf — тот файл идёт в prod-стадию образа, а
    # этот в dev (см. nginx/Dockerfile). Правки нужны в ОБОИХ: расхождение уже
    # один раз стоило нам этого бага, починенного только в проде.
    location = /api/recommendations/flow {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin'  $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Range, Origin, Accept, tuna-skip-browser-warning, ngrok-skip-browser-warning' always;
            add_header 'Access-Control-Max-Age'       1728000 always;
            add_header 'Content-Type'                 'text/plain; charset=utf-8';
            add_header 'Content-Length'                0;
            return 204;
        }
        proxy_pass http://backend_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Connection        "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_hide_header Cache-Control;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin $cors_origin always;
    }

    # Кэширование рекомендаций.
    location /api/recommendations {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin'  $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Range, Origin, Accept, tuna-skip-browser-warning, ngrok-skip-browser-warning' always;
            add_header 'Access-Control-Max-Age'       1728000 always;
            add_header 'Content-Type'                 'text/plain; charset=utf-8';
            add_header 'Content-Length'                0;
            return 204;
        }
        proxy_pass http://backend_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Connection        "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_hide_header Cache-Control;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Cache-Control "private, max-age=60";
        add_header Access-Control-Allow-Origin $cors_origin always;
    }

    # Кэширование поиска.
    location /api/search {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin'  $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Range, Origin, Accept, tuna-skip-browser-warning, ngrok-skip-browser-warning' always;
            add_header 'Access-Control-Max-Age'       1728000 always;
            add_header 'Content-Type'                 'text/plain; charset=utf-8';
            add_header 'Content-Length'                0;
            return 204;
        }
        proxy_pass http://backend_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Connection        "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_hide_header Cache-Control;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Cache-Control "private, max-age=120";
        add_header Access-Control-Allow-Origin $cors_origin always;
    }

    # Директ-отдача музыки/обложек (фоллбэк для старых path).
    location /music_files/ {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin'  $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Range, Origin, Accept' always;
            add_header 'Access-Control-Max-Age'       1728000 always;
            return 204;
        }
        proxy_pass http://backend_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        add_header Access-Control-Allow-Origin $cors_origin always;
    }

    location /cover_files/ {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin'  $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Origin, Accept' always;
            add_header 'Access-Control-Max-Age'       1728000 always;
            return 204;
        }
        proxy_pass http://backend_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Фронтенд-бандлы (JS, CSS) — кэшируем на год.
    location ~* \.(?:js|css)$ {
        proxy_pass http://frontend_upstream;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Глушим Accept-Encoding в сторону фронтенда: в прод-образе там свой
        # nginx с gzip, а уже сжатый ответ фильтры сжатия пропускают — brotli
        # этого сервера не применялся бы к бандлам вовсе. Дубль правила в
        # snippets/app-locations.conf (prod-стадия), держим одинаковыми.
        proxy_set_header Accept-Encoding "";
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # config.js генерируется на старте из переменных окружения и НЕ хэширован —
    # закэшировав его надолго, мы бы залипли на старом API URL после смены env.
    # Правило выше по JS-расширению его бы поймало, поэтому точное совпадение (=)
    # перехватывает раньше.
    location = /config.js {
        proxy_pass http://frontend_upstream;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header Cache-Control "no-store" always;
    }

    # Фронтенд-корень: SPA отдаёт index.html на все остальные пути.
    location / {
        proxy_pass http://frontend_upstream;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
