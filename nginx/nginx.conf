# Reverse proxy, объединяющий фронтенд и бэкенд под одним origin.
# Позволяет пробросить сервис одним туннелем (ngrok http 80) и открывать
# его с других устройств: фронтенд сам берёт API по window.location.origin + /api.

# Разрешаем WebSocket upgrade (Vite HMR + возможные ws у бэкенда).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ngrok терминирует TLS и ходит к nginx по http, но присылает исходную схему
# в X-Forwarded-Proto. Пробрасываем её дальше (иначе бэкенд строит http-редиректы
# и ломается https → mixed content). Локальный доступ без заголовка → $scheme.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

upstream frontend_upstream {
    server frontend:3000;
    # Пул постоянных соединений к upstream: без него каждый запрос
    # открывает новый TCP-коннект (лишний RTT + нагрузка на обе стороны).
    keepalive 16;
}

upstream backend_upstream {
    server backend:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Загрузка треков может быть большой — снимаем ограничение по размеру тела.
    client_max_body_size 1024m;

    # Сжатие текстовых ответов (JSON поиска/плейлистов, бандлы фронта): через
    # медленный туннель (ngrok) размер ответа напрямую превращается в задержку.
    # gzip_proxied any — жмём и проксированные ответы бэкенда/vite.
    gzip on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types application/json application/javascript text/javascript application/xml text/xml text/css text/plain image/svg+xml application/manifest+json;

    # Общие заголовки проксирования.
    # ВАЖНО: любой proxy_set_header внутри location отменяет наследование
    # ВСЕХ этих директив — в таких location полный набор продублирован.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # API бэкенда.
    location /api/ {
        proxy_pass http://backend_upstream;
        # keepalive к upstream требует Connection: "" (иначе Connection: upgrade
        # закрывает соединение после каждого запроса). WebSocket на /api/
        # не используется. Остальные заголовки продублированы вручную,
        # потому что наследование с уровня server здесь отключается.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Connection        "";
        # Стриминг/долгие запросы (скачивание, поиск) не буферизуем.
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Статика бэкенда: аудиофайлы (с Range-запросами) и обложки.
    location /music_files/ {
        proxy_pass http://backend_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Connection        "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        # Файл трека неизменен после загрузки — кэшируем в браузере:
        # повторное прослушивание и перемотки не гоняют аудио по туннелю заново.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=604800";
    }

    location /cover_files/ {
        proxy_pass http://backend_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Connection        "";
        # Обложки неизменны для данного файла — пусть браузер держит их в кэше
        # и не гоняет по туннелю повторно (и не конкурирует за его полосу с
        # аудио в момент старта трека).
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=604800";
    }

    # Всё остальное — Vite dev server фронтенда (включая HMR WebSocket).
    location / {
        proxy_pass http://frontend_upstream;
        proxy_read_timeout 3600s;
    }
}
