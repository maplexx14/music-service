version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: music_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-music_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-music_password}
      POSTGRES_DB: ${POSTGRES_DB:-music_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U music_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: music_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: music_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # веб-консоль
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: music_backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-music_user}:${POSTGRES_PASSWORD:-music_password}@postgres:5432/${POSTGRES_DB:-music_db}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Хранилище: minio (объектное, по умолчанию) или local (диск).
      STORAGE_BACKEND: ${STORAGE_BACKEND:-minio}
      # Внутренний адрес MinIO в docker-сети (put/remove).
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      # Адрес, по которому БРАУЗЕР тянет аудио/обложки (presigned/публичные URL).
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      MINIO_BUCKET_MUSIC: ${MINIO_BUCKET_MUSIC:-music}
      MINIO_BUCKET_COVERS: ${MINIO_BUCKET_COVERS:-covers}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env (e.g. openssl rand -hex 32)}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      JAMENDO_CLIENT_ID: ${JAMENDO_CLIENT_ID:-}
      SLSKD_URL: ${SLSKD_URL:-http://slskd:5030}
      SLSKD_API_KEY: ${SLSKD_API_KEY:-}
      SOULSEEK_USERNAME: ${SOULSEEK_USERNAME:-}
      SLSKD_DOWNLOADS_DIR: /app/slskd_downloads
      SLSKD_INCOMPLETE_DIR: /app/slskd_incomplete
      YTDLP_CACHE_DIR: /app/ytdlp_cache
      YTDLP_CACHE_MAX_MB: ${YTDLP_CACHE_MAX_MB:-4096}
      INVIDIOUS_ENABLED: ${INVIDIOUS_ENABLED:-0}
      INVIDIOUS_API_BASE: ${INVIDIOUS_API_BASE:-}
      INVIDIOUS_TIMEOUT: ${INVIDIOUS_TIMEOUT:-10}
      # Конкурентность: пул БД и threadpool согласованы между собой.
      # pool_size + max_overflow не должно превышать Postgres max_connections
      # (по умолчанию 100) в сумме по всем воркерам.
      DB_POOL_SIZE: ${DB_POOL_SIZE:-20}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-40}
      THREADPOOL_TOKENS: ${THREADPOOL_TOKENS:-60}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - music_files:/app/music_files
      - ytdlp_cache:/app/ytdlp_cache
      - slskd_downloads:/app/slskd_downloads:ro
      - slskd_incomplete:/app/slskd_incomplete:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    # --proxy-headers + --forwarded-allow-ips='*': доверяем X-Forwarded-Proto от nginx,
    # иначе FastAPI строит редиректы (trailing slash) с http и ломает https через ngrok
    # (mixed active content).
    command: sh -c "alembic upgrade head && gunicorn app.main:app -k uvicorn.workers.UvicornWorker -w 4 -b 0.0.0.0:8000 --proxy-headers --forwarded-allow-ips='*'"

  slskd:
    image: slskd/slskd:latest
    container_name: music_slskd
    environment:
      SLSKD_SLSK_USERNAME: ${SOULSEEK_USERNAME:-}
      SLSKD_SLSK_PASSWORD: ${SOULSEEK_PASSWORD:-}
      SLSKD_DOWNLOADS_DIR: /app/downloads
      SLSKD_INCOMPLETE_DIR: /app/incomplete
    ports:
      - "5030:5030"
      - "50300:50300"
    volumes:
      - ./slskd/slskd.yml:/app/slskd.yml
      - ./backend/music_files:/app/shared:ro
      - slskd_downloads:/app/downloads
      - slskd_incomplete:/app/incomplete
      - slskd_data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Пусто по умолчанию: фронтенд возьмёт API как window.location.origin + /api,
        # что нужно для доступа с других устройств через reverse proxy / ngrok.
        VITE_API_URL: ${VITE_API_URL:-}
    container_name: music_frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-}
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: music_nginx
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend

  # Публичный доступ через Cloudflare Tunnel (быстрее ngrok-free и без
  # interstitial-страницы предупреждения). Туннель ходит к nginx:80 внутри
  # docker-сети — наружу порт открывать не нужно.
  #
  # По умолчанию — Quick Tunnel: случайный https://<...>.trycloudflare.com,
  # аккаунт не требуется (прямая замена `ngrok http 80`). URL печатается в лог:
  #   docker compose logs cloudflared | grep trycloudflare.com
  #
  # Постоянный домен — Named Tunnel: создайте туннель в Cloudflare Zero Trust
  # (Networks → Tunnels), направьте public hostname на http://nginx:80 и задайте
  # в .env:  CLOUDFLARE_TUNNEL_CMD=run --token <ТОКЕН>
  cloudflared:
    # Пиновано (было :latest): образ с публичным туннелем наружу — не место
    # для автоматического подхвата любого свежего тега. Обновлять осознанно.
    image: cloudflare/cloudflared:2026.7.1
    container_name: music_cloudflared
    restart: unless-stopped
    # --protocol http2: туннель по TCP 443 вместо QUIC/UDP 7844. Многие сети
    # (в т.ч. частые домашние/мобильные) режут UDP 7844 — на QUIC cloudflared
    # тогда бесконечно ловит "failed to dial to edge with quic: timeout" и
    # туннель отвечает 530. http2 использует обычный TLS-порт и работает везде.
    command: tunnel --no-autoupdate --protocol http2 ${CLOUDFLARE_TUNNEL_CMD:---url http://nginx:80}
    depends_on:
      - nginx

volumes:
  postgres_data:
  redis_data:
  minio_data:
  music_files:
  ytdlp_cache:
  frontend_node_modules:
  slskd_downloads:
  slskd_incomplete:
  slskd_data:
