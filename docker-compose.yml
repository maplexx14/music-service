version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: music_postgres
    # Без restart-политики стек не поднимается после перезагрузки хоста или
    # рестарта Docker Desktop: однажды всё легло на трое суток (backend/nginx/
    # frontend/minio/slskd в Exited 255, postgres в 137) и снаружи это выглядело
    # как «сервис стал медленным», хотя не слушал вообще никто.
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-music_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-music_password}
      POSTGRES_DB: ${POSTGRES_DB:-music_db}
    # max_connections: должен покрывать (DB_POOL_SIZE + DB_MAX_OVERFLOW) × GUNICORN_WORKERS
    # backend'а (см. database.py) плюс запас под alembic/psql. Дефолт Postgres — 100,
    # мало при GUNICORN_WORKERS=8. Под 10k активных юзеров: (20+20)×8=320 + запас = 400.
    #
    # Память: shared_buffers и effective_cache_size масштабируются с RAM хоста.
    # На контейнере с 8GB выделенной памяти: shared_buffers=2GB (25%),
    # effective_cache_size=6GB (75%). На production с 16GB настроить 4GB/12GB.
    # work_mem=16MB на запрос × 400 соединений = до 6.4GB под тяжёлые сортировки
    # (в реальности пик гораздо ниже — большинство запросов простые).
    command: >
      postgres
      -c max_connections=${POSTGRES_MAX_CONNECTIONS:-400}
      -c shared_buffers=${POSTGRES_SHARED_BUFFERS:-2GB}
      -c effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-6GB}
      -c work_mem=16MB
      -c maintenance_work_mem=512MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U music_user -d music_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: music_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: music_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # веб-консоль
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: music_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-music_user}:${POSTGRES_PASSWORD:-music_password}@postgres:5432/${POSTGRES_DB:-music_db}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Хранилище: minio (объектное, по умолчанию) или local (диск).
      STORAGE_BACKEND: ${STORAGE_BACKEND:-minio}
      # Внутренний адрес MinIO в docker-сети (put/remove).
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      # Адрес, по которому БРАУЗЕР тянет аудио/обложки (presigned/публичные URL).
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      MINIO_BUCKET_MUSIC: ${MINIO_BUCKET_MUSIC:-music}
      MINIO_BUCKET_COVERS: ${MINIO_BUCKET_COVERS:-covers}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env (e.g. openssl rand -hex 32)}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      # ─── Почта (подтверждение адреса, коды входа) ───
      # Пустой SMTP_HOST = почта не отправляется, содержимое письма уходит в лог
      # (см. mailer.py) — штатный путь локальной разработки.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Music Streaming}
      SMTP_FROM: ${SMTP_FROM:-noreply@localhost}
      SMTP_REPLY_TO: ${SMTP_REPLY_TO:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_TIMEOUT: ${SMTP_TIMEOUT:-10}
      SMTP_REQUIRED: ${SMTP_REQUIRED:-false}
      EMAIL_2FA_CODE_TTL_SEC: ${EMAIL_2FA_CODE_TTL_SEC:-600}
      EMAIL_2FA_MAX_ATTEMPTS: ${EMAIL_2FA_MAX_ATTEMPTS:-5}
      EMAIL_2FA_RESEND_COOLDOWN_SEC: ${EMAIL_2FA_RESEND_COOLDOWN_SEC:-60}
      EMAIL_VERIFY_TOKEN_TTL_SEC: ${EMAIL_VERIFY_TOKEN_TTL_SEC:-86400}
      # Базовый адрес фронта для ссылки подтверждения в письме.
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost}
      # ─── Каптча на регистрации (Cloudflare Turnstile) ───
      # Нужны ОБА ключа, иначе проверка полностью выключается и регистрация
      # открыта скриптам (см. captcha.py). Тестовые ключи «всегда пройдено»:
      #   TURNSTILE_SITE_KEY=1x00000000000000000000AA
      #   TURNSTILE_SECRET_KEY=1x0000000000000000000000000000000AA
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      # DEBUG=1 пишет коды 2FA в лог, когда SMTP не настроен. Только для разработки.
      DEBUG: ${DEBUG:-}
      JAMENDO_CLIENT_ID: ${JAMENDO_CLIENT_ID:-}
      SLSKD_URL: ${SLSKD_URL:-http://slskd:5030}
      SLSKD_API_KEY: ${SLSKD_API_KEY:-}
      SOULSEEK_USERNAME: ${SOULSEEK_USERNAME:-}
      SLSKD_DOWNLOADS_DIR: /app/slskd_downloads
      SLSKD_INCOMPLETE_DIR: /app/slskd_incomplete
      YTDLP_CACHE_DIR: /app/ytdlp_cache
      YTDLP_CACHE_MAX_MB: ${YTDLP_CACHE_MAX_MB:-4096}
      INVIDIOUS_ENABLED: ${INVIDIOUS_ENABLED:-0}
      INVIDIOUS_API_BASE: ${INVIDIOUS_API_BASE:-}
      INVIDIOUS_TIMEOUT: ${INVIDIOUS_TIMEOUT:-10}
      # Прокси для скачивания googlevideo: ссылка привязана к IP выхода,
      # который её выдал, поэтому при проксированном companion аудио надо
      # качать через тот же прокси. Файла нет — прямой выход.
      STREAM_PROXY_FILE: ${STREAM_PROXY_FILE:-/run/stream-proxy/active.url}
      STREAM_PROXY: ${STREAM_PROXY:-}
      # ─── Yandex Music (нативная интеграция) ───
      # OAuth-токен для обхода CAPTCHA. Получить: https://github.com/MarshalX/yandex-music/blob/main/docs/authentication.md
      YANDEX_MUSIC_TOKEN: ${YANDEX_MUSIC_TOKEN:-}
      # ─── Last.fm (похожие треки для потока рекомендаций) ───
      # Ключ нужен только источнику «похожие по названию трека»
      # (app/beets_similar.py → flow._lastfm_pool). Пусто = источник выключен,
      # поток работает на остальных трёх. Встроенный ключ beets в фолбэке есть,
      # но Last.fm отвечает на него Access Denied, так что нужен свой:
      # https://www.last.fm/api/account/create
      LASTFM_API_KEY: ${LASTFM_API_KEY:-}
      # ─── Spotify (метаданные для импорта; аудио матчится в YouTube Music) ───
      # Client ID/Secret приложения: https://developer.spotify.com/dashboard
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      SPOTIFY_MARKET: ${SPOTIFY_MARKET:-US}
      # AAC transcoding: all audio is compressed to AAC for smaller files.
      TRANSCODE_ENABLED: ${TRANSCODE_ENABLED:-1}
      AAC_BITRATE: ${AAC_BITRATE:-128}
      AAC_SAMPLE_RATE: ${AAC_SAMPLE_RATE:-44100}
      # Конкурентность: пул БД и threadpool согласованы между собой.
      # (pool_size + max_overflow) × число воркеров gunicorn не должно превышать
      # Postgres max_connections. Под таргет 10k активных юзеров (~1k одновременных
      # стримов): (20+20)×8=320 vs max_connections=400 — запас под alembic/psql.
      DB_POOL_SIZE: ${DB_POOL_SIZE:-20}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-20}
      # Стримы (файл/MinIO) не держат соединение БД, поэтому тредов под них можно
      # больше, чем DB-пула: GUNICORN_WORKERS(8) × 70 = 560 конкурентных стримов —
      # запас над таргетом 500 одновременных слушателей.
      THREADPOOL_TOKENS: ${THREADPOOL_TOKENS:-70}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-8}
    # Invidious — отдельный compose-стек (invidious/), связи по сети между ними
    # нет, поэтому INVIDIOUS_API_BASE ходит через host.docker.internal. Docker
    # Desktop резолвит это имя сам, Linux — нет, и на Linux-хосте резолв через
    # Invidious молча падал бы, оставляя только yt-dlp.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - music_files:/app/music_files
      - ytdlp_cache:/app/ytdlp_cache
      - cookies_data:/app/cookies
      # Активный прокси для скачивания googlevideo (см. docker-compose.prod.yml
      # и invidious/proxy-pool/README.md). Каталог, а не файл: rotate.sh
      # подменяет active.url через mv, и mount файла показывал бы старый inode.
      - ./invidious/proxy-pool/stream-proxy:/run/stream-proxy:ro
      - slskd_downloads:/app/slskd_downloads:ro
      - slskd_incomplete:/app/slskd_incomplete:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    # UvicornWorker обрабатывает proxy-заголовки по умолчанию, а gunicorn-флаг
    # --forwarded-allow-ips='*' разрешает доверять X-Forwarded-Proto от nginx,
    # иначе FastAPI строит редиректы (trailing slash) с http и ломает https через ngrok
    # (mixed active content).
    command: sh -c "alembic upgrade head && gunicorn app.main:app -k uvicorn.workers.UvicornWorker -w ${GUNICORN_WORKERS:-8} -b 0.0.0.0:8000 --forwarded-allow-ips='*'"

  slskd:
    image: slskd/slskd:latest
    container_name: music_slskd
    restart: unless-stopped
    environment:
      SLSKD_SLSK_USERNAME: ${SOULSEEK_USERNAME:-}
      SLSKD_SLSK_PASSWORD: ${SOULSEEK_PASSWORD:-}
      SLSKD_DOWNLOADS_DIR: /app/downloads
      SLSKD_INCOMPLETE_DIR: /app/incomplete
    ports:
      - "5030:5030"
      - "50300:50300"
    volumes:
      - ./slskd/slskd.yml:/app/slskd.yml
      - ./backend/music_files:/app/shared:ro
      - slskd_downloads:/app/downloads
      - slskd_incomplete:/app/incomplete
      - slskd_data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Пусто по умолчанию: фронтенд возьмёт API как window.location.origin + /api,
        # что нужно для доступа с других устройств через reverse proxy / tunnel.
        VITE_API_URL: ${VITE_API_URL:-}
    container_name: music_frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-}
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: music_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend

  # Публичный доступ через Tuna tunnel. Туннель ходит к nginx:80 внутри
  # docker-сети — наружу порт открывать не нужно.
  #
  # URL печатается в лог:
  #   docker compose logs tuna
  # tuna:
  #   image: yuccastream/tuna:latest
  #   container_name: music_tuna
  #   restart: unless-stopped
  #   environment:
  #     TUNA_TOKEN: ${TUNA_TOKEN:?Set TUNA_TOKEN in .env}
  #   command: http nginx:80
  #   depends_on:
  #     - nginx

volumes:
  postgres_data:
  redis_data:
  minio_data:
  music_files:
  ytdlp_cache:
  cookies_data:
  frontend_node_modules:
  slskd_downloads:
  slskd_incomplete:
  slskd_data:
