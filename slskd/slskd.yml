# Конфиг slskd, монтируется в /app/slskd.yml.
# Учётные данные Soulseek задаются через env (SLSKD_SLSK_USERNAME/PASSWORD) в docker-compose.
# Здесь — только API-ключ для REST API (вложенные словари через env ненадёжны).
web:
  authentication:
    api_keys:
      default:
        key: bd9a149c4fd40831c908e9e44c9e623d5c3fa85383b2637a73e5c1093dac3d00
        role: administrator
        cidr: 0.0.0.0/0,::/0
# Soulseek требует, чтобы пользователь что-то раздавал — иначе сеть не отдаёт
# результаты поиска и не выдаёт распределённого родителя.
shares:
  directories:
    - /app/shared
    - /app/downloads
# Автоудаление загрузок (минуты с завершения). Фоновый сборщик библиотеки
# (backend/app/slsk_harvest.py) качает ~12 ГБ в сутки, в основном FLAC: они
# больше лимита архива и в MinIO не уносятся, а прочие файлы уносятся в
# течение 45 минут. Без удаления том рос до заполнения диска (2026-10-01:
# диск 100%, Postgres не стартовал). Шесть часов — запас на перенос в MinIO
# и повторное прослушивание FLAC без новой закачки у пира.
retention:
  files:
    complete: 360
    incomplete: 360
