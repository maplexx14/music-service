<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>bolt — новый дизайн</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:40px;background:#222323;color:#f4f5ed;font-family:system-ui,sans-serif}header{max-width:1500px;margin:auto}h1{font-weight:500;font-size:38px;letter-spacing:-.05em;margin:0}p{color:#b2bcae;font-size:14px;line-height:1.6}nav{display:flex;gap:10px;margin:24px 0}button{background:#343632;color:#eee;border:0;border-radius:999px;padding:12px 20px;cursor:pointer}button[aria-pressed=true]{background:#c4d6c9;color:#222323}main{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:30px;max-width:1500px;margin:auto}main.mobile{grid-template-columns:repeat(4,minmax(0,1fr))}figure{margin:0}img{width:100%;display:block;border-radius:18px;border:1px solid #ffffff15}figcaption{margin-top:12px;color:#c8d4c3;font-size:14px}a{color:inherit;text-decoration:none}a:focus-visible,button:focus-visible{outline:2px solid #c4d6c9;outline-offset:5px}@media(max-width:850px){body{padding:20px}main{grid-template-columns:1fr}main.mobile{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
<header><h1>bolt. Только музыка.</h1><p>Монохромный интерфейс по новому референсу. CD-проигрыватель сохранён. Скриншоты с демонстрационными данными.<br>Нажми на экран, чтобы открыть изображение в полном размере.</p><nav aria-label="Версия интерфейса"><button aria-pressed="true" data-mode="desktop">Компьютер</button><button aria-pressed="false" data-mode="mobile">Телефон</button></nav></header><main></main>
<script>
const screens=[['home','Главная'],['search','Поиск'],['library-playing','Медиатека с плеером'],['library','Медиатека'],['liked','Понравившиеся'],['history','История'],['settings','Настройки'],['player','Плеер'],['mini-player','Компактный плеер'],['login','Вход']];
function show(mode){const main=document.querySelector('main');main.className=mode;main.replaceChildren();for(const [file,title] of [...screens,...(mode==='mobile'?[['home-more','Главная · продолжение']]:[])]){const figure=document.createElement('figure'),a=document.createElement('a'),img=document.createElement('img'),caption=document.createElement('figcaption');a.href=mode+'-'+file+'.png';a.target='_blank';a.rel='noopener';img.src=a.href;img.alt=title;img.loading='lazy';caption.textContent=title;a.append(img);figure.append(a,caption);main.append(figure)}for(const button of document.querySelectorAll('button'))button.setAttribute('aria-pressed',String(button.dataset.mode===mode))}document.querySelectorAll('button').forEach(b=>b.onclick=()=>show(b.dataset.mode));show('desktop');
</script></html>
