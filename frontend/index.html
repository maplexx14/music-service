<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- Иконки: только реально нужных размеров. favicon-64.png и
         apple-touch-icon.png — это один и тот же мастер 1025×1025 на 331 КБ
         каждый (файлы когда-то разъехались с именами), и оба тянулись из
         <head> на каждой холодной загрузке. На iOS цена вдвое выше: WebKit —
         единственный движок, который вообще запрашивает apple-touch-icon,
         то есть 331 КБ, которых не платит ни один другой браузер, плюс
         apple-touch-startup-image ниже. Здесь ссылки на корректные варианты:
         favicon-64-64.png — даунскейл мастера favicon-64.png, 64×64 (3.5 КБ),
         и 180×180 (apple-touch-icon-v2.png). Мастер при смене картинки пересобрать
         (и сменить имена -vN: iOS и SW держат иконку по URL):
         python3 -c "from PIL import Image; Image.open('favicon-64.png').convert('RGBA').resize((64,64), Image.LANCZOS).save('favicon-64-64.png', optimize=True)" -->
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64-64.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-v2.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- maximum-scale=1: iOS зумит страницу при фокусе на поле с шрифтом
         мельче 16px и не отзумливает обратно — интерфейс «уезжал». Ручной
         пинч-зум iOS при этом всё равно разрешает. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#050505" />
    <meta name="application-name" content="bolt" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="bolt" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- iOS-сплэши: генерируются скриптом scripts/make_splash.py, руками не
         править. Линки идут от крупных к мелким — iOS берёт первый подходящий
         по media-запросу, неподходящие просто не скачиваются (iOS fetch'ит
         только совпавший размер). -->
    <link rel="apple-touch-startup-image" href="/apple-splash-v3-1290-2796.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/apple-splash-v3-1179-2556.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/apple-splash-v3-1284-2778.png" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/apple-splash-v3-1170-2532.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/apple-splash-v3-1125-2436.png" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/apple-splash-v3-1242-2688.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/apple-splash-v3-828-1792.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2)" />
    <link rel="apple-touch-startup-image" href="/apple-splash-v3-1242-2208.png" media="(device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/apple-splash-v3-750-1334.png" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2)" />
    <link rel="apple-touch-startup-image" href="/apple-splash-v3-640-1136.png" media="(device-width: 320px) and (device-height: 568px) and (-webkit-device-pixel-ratio: 2)" />
    <!-- Шрифт свой: @font-face в src/index.css. Google Fonts отсюда убран —
         он блокировал отрисовку двумя цепочками к чужим доменам. -->
    <!-- Рантайм-конфиг: в <head> с defer, чтобы не тормозить парсер. Порядок
         с бандлом сохраняется — defer и модули идут в порядке документа. -->
    <script defer src="/config.js"></script>
    <title>bolt — музыка</title>
    <!-- Фон до загрузки бандла CSS: иначе после сплэша iOS на мгновение
         показывает белый WebView. Цвет — как у сплэша (make_splash.py). -->
    <style>html, body { background-color: #000; }</style>
    <!-- Заставка загрузки: продолжает статичный сплэш iOS (тот же логотип,
         размер и место — ICON_SHARE / ICON_Y / CORNER из make_splash.py),
         поэтому подмена PNG на HTML не видна, а дальше из сердца вылетают
         молнии, пока не стартует бандл. -->
    <style>
      #boot-splash { position: fixed; inset: 0; z-index: 9999; background: #000; pointer-events: none; transition: opacity 180ms cubic-bezier(.165, .84, .44, 1); }
      #boot-splash.is-hiding { opacity: 0; }
      #boot-splash .boot-logo { position: absolute; left: 50%; top: 48.5%; width: min(24.5vw, 112px); aspect-ratio: 1; transform: translate(-50%, -50%); }
      #boot-splash .boot-logo img { display: block; width: 100%; height: 100%; border-radius: 22.5%; }
      /* Молнии стартуют из центра сердца, позади логотипа: «вылетают» из-за него. */
      #boot-splash .boot-bolt { position: absolute; left: 50%; top: 48.5%; height: auto; opacity: 0; will-change: transform, opacity; }
    </style>
    <!-- Сторож загрузки. SW на медленной сети отдаёт index.html из кэша, и
         тот может ссылаться на бандл прошлого деплоя, которого на сервере уже
         нет: модуль не исполнится, React не стартует — чёрный экран навсегда.
         Ловим ошибку загрузки /assets/*, выбрасываем кэш каркаса SW и один раз
         перезагружаемся (логика и ключ флага — как в src/services/staleBuild.js).
         Если бандл так и не стартовал — показываем кнопку вместо пустоты. -->
    <script>
      (function () {
        var KEY = 'bolt-stale-reload-at'
        function recover(force) {
          try {
            if (!force && Date.now() - Number(sessionStorage.getItem(KEY) || 0) < 60000) return false
            sessionStorage.setItem(KEY, String(Date.now()))
          } catch (e) {}
          var reload = function () { location.reload() }
          if (!window.caches) return reload(), true
          caches.keys().then(function (keys) {
            return Promise.all(keys.filter(function (k) { return k.indexOf('bolt-shell') === 0 }).map(function (k) { return caches.delete(k) }))
          }).then(reload, reload)
          return true
        }
        function showFallback() {
          if (window.__boltBooted || document.getElementById('boot-fallback')) return
          if (window.__bootSplashHide) window.__bootSplashHide()
          if (!document.body) return void document.addEventListener('DOMContentLoaded', showFallback)
          var box = document.createElement('div')
          box.id = 'boot-fallback'
          box.style.cssText = 'position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:#fff;font:17px -apple-system,system-ui,sans-serif'
          box.innerHTML = '<div>Не удалось загрузить приложение</div><button type="button" style="padding:12px 24px;border:0;border-radius:12px;background:#fff;color:#000;font-size:16px">Обновить</button>'
          box.querySelector('button').onclick = function () { recover(true) }
          document.body.appendChild(box)
        }
        window.addEventListener('error', function (e) {
          var el = e.target
          var src = el && (el.src || el.href)
          if (window.__boltBooted || !src || src.indexOf('/assets/') === -1) return
          if (!recover(false)) showFallback()
        }, true)
        setTimeout(function () { if (!window.__boltBooted) showFallback() }, 15000)
      })()
    </script>
  </head>
  <body>
    <div id="boot-splash" aria-hidden="true">
      <div class="boot-logo"><img src="/icon-192-v2.webp" alt="" /></div>
    </div>
    <script>
      (function () {
        var root = document.getElementById('boot-splash')
        var logo = root.querySelector('.boot-logo')
        var MIN_SHOW_MS = 600 // от начала навигации: хотя бы пара молний успевает вылететь
        var timer = 0
        var lastAngle = Math.random() * Math.PI * 2
        var reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches
        var canAnimate = !reduced && typeof Element.prototype.animate === 'function'

        // Молнии в стиле логотипа: плоская фиолетовая заливка с острыми
        // концами и белый мазок кисти по одной стороне. Сухой край кисти —
        // шум feTurbulence внутри SVG-картинки: браузер растеризует её один
        // раз, а анимируются только transform и opacity готового <img>.
        // Тело молнии, затем край, по которому идёт белый мазок.
        var SHAPES = [
          ['M30 2L8 58L27 55L18 98L54 40L34 43L46 2Z', 'M30 2L8 58L27 55L18 98'],
          ['M28 0L6 52L25 50L13 100L50 44L32 46L42 0Z', 'M28 0L6 52L25 50L13 100'],
          ['M36 4L10 54L29 53L16 96L56 41L36 42L52 4Z', 'M36 4L10 54L29 53L16 96'],
        ]
        var SPRITES = SHAPES.map(function (s, i) {
          var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -8 76 116">' +
            '<defs><filter id="b" x="-15%" y="-15%" width="130%" height="130%">' +
            '<feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="' + (i * 7 + 3) + '"/>' +
            '<feDisplacementMap in="SourceGraphic" scale="3.2" xChannelSelector="R" yChannelSelector="G"/>' +
            '</filter></defs><g filter="url(#b)" stroke-linejoin="miter" stroke-miterlimit="10" fill="none">' +
            '<path d="' + s[0] + '" fill="#875df4"/>' +
            '<path d="' + s[1] + '" stroke="#fff" stroke-width="4.5" stroke-dasharray="22 1.5 9 2 30 1"/>' +
            '<path d="' + s[1] + '" stroke="#fff" stroke-width="1.4" stroke-opacity=".75" transform="translate(-2.2 .6)" stroke-dasharray="6 3 14 2 4 4"/>' +
            '</g></svg>'
          return 'data:image/svg+xml,' + encodeURIComponent(svg)
        })

        function launch() {
          var size = logo.getBoundingClientRect().width
          var reach = Math.min(innerWidth, innerHeight) * 0.5
          // Новый вылет — не ближе 60° к прошлому, чтобы молнии разлетались веером.
          var angle = lastAngle + Math.PI / 3 + Math.random() * Math.PI * 4 / 3
          lastAngle = angle
          var w = size * (0.32 + Math.random() * 0.18)
          var img = document.createElement('img')
          img.className = 'boot-bolt'
          img.src = SPRITES[Math.floor(Math.random() * SPRITES.length)]
          img.style.width = w + 'px'
          root.insertBefore(img, logo)

          var dx = Math.cos(angle), dy = Math.sin(angle)
          var dist = reach * (0.6 + Math.random() * 0.4)
          // Острый нижний конец спрайта смотрит по направлению полёта, плюс
          // небольшой разворот в пути — как будто молнию швырнули.
          var turn = angle * 180 / Math.PI - 90
          var spin = (Math.random() - 0.5) * 40
          var flip = Math.random() < 0.5 ? -1 : 1
          function at(t, scale, rot) {
            return 'translate(-50%, -50%) translate(' + (dx * dist * t).toFixed(1) + 'px, ' + (dy * dist * t).toFixed(1) + 'px) rotate(' + (turn + rot).toFixed(1) + 'deg) scale(' + (scale * flip).toFixed(3) + ', ' + scale.toFixed(3) + ')'
          }
          // Вылет: резкий старт и долгое торможение — ease-out-quart.
          // Появление в первые 12%, пока молния ещё за сердцем; гаснет в конце пути.
          img.animate([
            { transform: at(0.08, 0.45, 0), opacity: 0 },
            { transform: at(0.3, 0.85, spin * 0.4), opacity: 1, offset: 0.12 },
            { transform: at(0.85, 1, spin * 0.9), opacity: 1, offset: 0.65 },
            { transform: at(1, 1, spin), opacity: 0 },
          ], { duration: 760, easing: 'cubic-bezier(.165, .84, .44, 1)' }).onfinish = function () { img.remove() }

          // Отдача: сердце чуть подпрыгивает, когда из него вылетает молния.
          logo.animate([
            { transform: 'translate(-50%, -50%) scale(1)' },
            { transform: 'translate(-50%, -50%) scale(1.04)', offset: 0.3 },
            { transform: 'translate(-50%, -50%) scale(1)' },
          ], { duration: 240, easing: 'cubic-bezier(.165, .84, .44, 1)' })

          timer = setTimeout(launch, 260 + Math.random() * 200)
        }

        window.__bootSplashHide = function () {
          window.__bootSplashHide = null
          var wait = Math.max(0, MIN_SHOW_MS - performance.now())
          setTimeout(function () {
            root.classList.add('is-hiding')
            setTimeout(function () { clearTimeout(timer); root.remove() }, 200)
          }, wait)
        }

        if (canAnimate) timer = setTimeout(launch, 80)
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
