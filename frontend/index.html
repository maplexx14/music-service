<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- Иконки: только реально нужных размеров. favicon-64.png и
         apple-touch-icon.png — это один и тот же мастер 1024×1024 на 331 КБ
         каждый (файлы когда-то разъехались с именами), и оба тянулись из
         <head> на каждой холодной загрузке. На iOS цена вдвое выше: WebKit —
         единственный движок, который вообще запрашивает apple-touch-icon,
         то есть 331 КБ, которых не платит ни один другой браузер, плюс
         apple-touch-startup-image ниже. Здесь ссылки на корректные варианты:
         64×64 (3.6 КБ) и 180×180 (18 КБ). -->
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-641.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon1.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#252933" />
    <meta name="application-name" content="bolt" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="bolt" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- iOS-сплэши: генерируются скриптом scripts/make_splash.py, руками не
         править. Линки идут от крупных к мелким — iOS берёт первый подходящий
         по media-запросу, неподходящие просто не скачиваются (iOS fetch'ит
         только совпавший размер). -->
    <link rel="apple-touch-startup-image" href="/apple-splash-1290-2796.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/apple-splash-1179-2556.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/apple-splash-1284-2778.png" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/apple-splash-1170-2532.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/apple-splash-1125-2436.png" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/apple-splash-1242-2688.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/apple-splash-828-1792.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2)" />
    <link rel="apple-touch-startup-image" href="/apple-splash-1242-2208.png" media="(device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/apple-splash-750-1334.png" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2)" />
    <link rel="apple-touch-startup-image" href="/apple-splash-640-1136.png" media="(device-width: 320px) and (device-height: 568px) and (-webkit-device-pixel-ratio: 2)" />
    <!-- Шрифт свой: @font-face в src/index.css. Google Fonts отсюда убран —
         он блокировал отрисовку двумя цепочками к чужим доменам. -->
    <!-- Рантайм-конфиг: в <head> с defer, чтобы не тормозить парсер. Порядок
         с бандлом сохраняется — defer и модули идут в порядке документа. -->
    <script defer src="/config.js"></script>
    <title>bolt — музыка</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
