# SPA-раздача собранной статики. Внутренний слой: наружу смотрит основной
# nginx (../nginx), который проксирует сюда и сам ставит CORS/кэш-заголовки
# для /api. Здесь — только файлы.

server {
    listen 3000;
    listen [::]:3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Логи доступа тут дублировали бы логи фронт-прокси — выключаем,
    # ошибки оставляем.
    access_log off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types application/json application/javascript text/javascript text/css text/plain image/svg+xml application/manifest+json;

    # config.js генерируется entrypoint'ом при каждом старте и НЕ хэширован:
    # закэшировав его, клиент залипнет на старом API URL после смены env.
    location = /config.js {
        add_header Cache-Control "no-store" always;
    }

    # index.html тоже не кэшируем: он ссылается на хэшированные бандлы, и
    # закэшированная копия после деплоя тянула бы за собой удалённые файлы.
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    # Хэшированные ассеты Vite — можно кэшировать навсегда.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA-роутинг: любой неизвестный путь отдаёт index.html, дальше
    # разбирается react-router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
