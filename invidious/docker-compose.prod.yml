# Self-hosted Invidious для music-service: быстрый резолв YouTube-аудио.
# Backend music-service ходит сюда через http://host.docker.internal:3050
# (см. .env музыкального проекта: INVIDIOUS_API_BASE). Companion обязателен —
# без него YouTube не отдаёт рабочие stream-URL (PO-token/signature).
#
# Запуск:  docker compose -f docker-compose.prod.yml up -d
services:
  invidious:
    image: quay.io/invidious/invidious:master
    restart: unless-stopped
    ports:
      - "3050:3000"
    environment:
      INVIDIOUS_CONFIG: |
        db:
          dbname: invidious
          user: kemal
          password: kemal
          host: invidious-db
          port: 5432
        check_tables: true
        invidious_companion:
        - private_url: "http://invidious-companion:8282/companion"
        invidious_companion_key: "qXoabG0Gkpo4xTyS"
        hmac_key: "219c5551b41588f3530463bf8397803b576e41c7a97efa4b19f31e7fff818d41"
    healthcheck:
      test: wget -nv --tries=1 --spider http://127.0.0.1:3000/api/v1/trending || exit 1
      interval: 30s
      timeout: 5s
      retries: 2
    depends_on:
      - invidious-db
      - invidious-companion

  invidious-companion:
    image: quay.io/invidious/invidious-companion:latest
    restart: unless-stopped
    environment:
      - SERVER_SECRET_KEY=qXoabG0Gkpo4xTyS
    cap_drop:
      - ALL
    read_only: true
    volumes:
      - companioncache:/var/tmp/youtubei.js:rw
    security_opt:
      - no-new-privileges:true

  invidious-db:
    image: docker.io/library/postgres:14
    restart: unless-stopped
    volumes:
      - postgresdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: invidious
      POSTGRES_USER: kemal
      POSTGRES_PASSWORD: kemal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kemal -d invidious"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgresdata:
  companioncache:
