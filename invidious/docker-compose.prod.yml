# Self-hosted Invidious для music-service: быстрый резолв YouTube-аудио.
# Backend music-service ходит сюда через http://host.docker.internal:3050
# (см. .env музыкального проекта: INVIDIOUS_API_BASE). Companion обязателен —
# без него YouTube не отдаёт рабочие stream-URL (PO-token/signature).
#
# Запуск:  docker compose -f docker-compose.prod.yml up -d
#
# Если YouTube начал блокировать выпуск PO-token по IP — есть оверлей с пулом
# исходящих прокси и автоматической ротацией: proxy-pool/README.md. Включать
# его нельзя без проксирования стриминга в бэкенде: ссылки googlevideo
# привязаны к IP запросившего (подписанный параметр `ip` в sparams), поэтому
# резолв через прокси + скачивание с адреса сервера = 403 на каждом треке.
services:
  invidious:
    image: quay.io/invidious/invidious:master
    restart: unless-stopped
    ports:
      - "3050:3000"
    environment:
      INVIDIOUS_CONFIG: |
        db:
          dbname: invidious
          user: kemal
          password: kemal
          host: invidious-db
          port: 5432
        check_tables: true
        invidious_companion:
        - private_url: "http://invidious-companion:8282/companion"
        invidious_companion_key: "qXoabG0Gkpo4xTyS"
        hmac_key: "219c5551b41588f3530463bf8397803b576e41c7a97efa4b19f31e7fff818d41"
    healthcheck:
      test: wget -nv --tries=1 --spider http://127.0.0.1:3000/api/v1/trending || exit 1
      interval: 30s
      timeout: 5s
      retries: 2
    depends_on:
      - invidious-db
      - invidious-companion

  invidious-companion:
    image: quay.io/invidious/invidious-companion:latest
    restart: unless-stopped
    # Куки YouTube для выпуска PO-token (см. proxy-pool/make-companion-cookies.sh):
    # env_file, а не environment — секрет не должен жить в git-файле. Файл
    # обязателен к существованию, поэтому после клона репо нужно выполнить
    # make-companion-cookies.sh (или создать пустой: touch companion-cookies.env).
    # Нет файла → compose откажется стартовать: это лучше, чем молча анонимно.
    env_file:
      - ./companion-cookies.env
    environment:
      - SERVER_SECRET_KEY=qXoabG0Gkpo4xTyS
      # Ретраи сетевых вызовов к YouTube. По умолчанию у companion выключены:
      # ОДИН transient-обрыв (TypeError: fetch failed на валидационном HEAD к
      # googlevideo — DNS-дрожь/обрыв соединения) бракует ВЕСЬ сминченный
      # PO-token, и сессия перевыпускается только кроном раз в 5 минут.
      # Наблюдали 2026-09-06: форматы YouTube отдавал, CDN с хоста отвечал
      # (curl → 302), но валидация падала на fetch failed, /player держал
      # «wait until a valid potoken is found» неограниченно долго.
      # 3 попытки с бэкоффом 1с→2с закрывают именно это.
      - NETWORKING_FETCH_RETRY_ENABLED=true
      - NETWORKING_FETCH_RETRY_TIMES=3
      - NETWORKING_FETCH_RETRY_INITIAL_DEBOUNCE=1000
      - NETWORKING_FETCH_RETRY_DEBOUNCE_MULTIPLIER=2
      # Таймаут одного fetch: дефолт 30с держит зависший запрос долго,
      # а сетевые сбои с VPS к YouTube характерно resolves за 10-15с.
      - NETWORKING_FETCH_TIMEOUT_MS=15000
      # YOUTUBE_SESSION_COOKIES (строка-заголовок "name=val; n2=v2", НЕ путь)
      # приходит из companion-cookies.env. Ручками здесь её не задавать: там
      # сессия Google-аккаунта, её место — в генерируемом файле, не в git.
    cap_drop:
      - ALL
    read_only: true
    volumes:
      - companioncache:/var/tmp/youtubei.js:rw
    security_opt:
      - no-new-privileges:true

  invidious-db:
    image: docker.io/library/postgres:14
    restart: unless-stopped
    volumes:
      - postgresdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: invidious
      POSTGRES_USER: kemal
      POSTGRES_PASSWORD: kemal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kemal -d invidious"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgresdata:
  companioncache:
