name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pytest -q

  # Прод-контейнер бэкенда стартует через `alembic upgrade head`
  # (docker-compose.prod.yml, command). Любая проблема с миграциями там
  # проявляется как контейнер, который не поднимается вообще — то есть уже
  # на проде. Поэтому миграции прогоняются здесь, на чистом Postgres той же
  # мажорной версии, что в прод-компоузе.
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci-password@127.0.0.1:5432/ci
      SECRET_KEY: ci-only-secret-key
      # Файлы миграций делают `from app.database import Base`. При `upgrade`
      # путь добавляет env.py, но `heads` его не выполняет — там импорт
      # держится только на PYTHONPATH (в прод-образе это ENV PYTHONPATH=/app).
      PYTHONPATH: ${{ github.workspace }}/backend
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      # Две головы = `upgrade head` падает с Multiple head revisions.
      # Отдельный шаг, чтобы в логе была понятная причина, а не трейс alembic.
      # Соединения с БД тут не происходит: heads читает каталог versions.
      - name: Alembic has exactly one head
        run: |
          heads="$(alembic heads | grep -c . || true)"
          if [ "$heads" != "1" ]; then
            echo "::error::Ожидалась одна голова Alembic, найдено: $heads"
            alembic heads
            exit 1
          fi
      - name: Apply migrations to a clean database
        run: alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  images:
    runs-on: ubuntu-latest
    needs: [backend, migrations, frontend]
    # Прод-компоуз требует эти переменные через ${VAR:?...} — без них
    # не пройдёт даже парсинг файла. Значения фиктивные: собираются только
    # образы, ничего не запускается.
    env:
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ci-password
      POSTGRES_DB: ci
      MINIO_ACCESS_KEY: ci-minio
      MINIO_SECRET_KEY: ci-minio-password
      SECRET_KEY: ci-only-secret-key
      DOMAIN: example.invalid
    steps:
      - uses: actions/checkout@v4
      # То же, что делает первым шагом deploy.sh: ловит битый compose-файл
      # до того, как будут потрачены минуты на сборку.
      - name: Validate prod compose file
        run: docker compose -f docker-compose.prod.yml config --quiet
      - uses: docker/setup-buildx-action@v3
      # bake вместо `docker compose build`: тот же compose-файл как источник
      # правды (контексты, target у nginx, build args фронтенда), но с
      # экспортом кеша слоёв в кеш GitHub Actions. Без кеша каждый прогон
      # заново собирает nginx с brotli из исходников (clone + cmake + make,
      # см. nginx/Dockerfile) и ставит ffmpeg/nodejs в образ бэкенда.
      #
      # scope у каждого образа свой: общий scope три цели перезаписывали бы
      # друг другу манифест кеша, и попаданий бы не было.
      - uses: docker/bake-action@v5
        with:
          files: docker-compose.prod.yml
          set: |
            backend.cache-from=type=gha,scope=backend
            backend.cache-to=type=gha,mode=max,scope=backend
            frontend.cache-from=type=gha,scope=frontend
            frontend.cache-to=type=gha,mode=max,scope=frontend
            nginx.cache-from=type=gha,scope=nginx
            nginx.cache-to=type=gha,mode=max,scope=nginx
