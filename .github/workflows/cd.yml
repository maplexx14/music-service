name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          script_stop: true
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            # GitHub транзиентно режет git-протокол с датацентровых IP
            # (secondary rate-limit): один fetch падает, через минуту — работает.
            # Ретраи с паузой превращают разовый обрыв в задержку деплоя,
            # а не в его остановку. Креды не трогаем: репозиторий публичный.
            for i in 1 2 3 4 5; do
              git fetch --prune origin && break
              echo "git fetch failed (attempt $i/5), retrying in 60s..."
              sleep 60
            done
            # Жёсткая синхронизация вместо `merge --ff-only`: main в этом
            # репозитории переписывается force-push'ем, после чего локальная
            # ветка сервера расходится с origin/main и ff-merge падает с
            # "Not possible to fast-forward" — деплой останавливался до ручного
            # вмешательства. checkout -B переставляет ветку на свежий origin/main
            # независимо от того, что было в ней раньше.
            #
            # Затирает правки ОТСЛЕЖИВАЕМЫХ файлов, сделанные прямо на сервере:
            # сервер здесь — зеркало origin/main, а не место для хотфиксов.
            # Неотслеживаемое и игнорируемое не трогает, поэтому .env.prod
            # (см. .gitignore) и данные в томах на месте.
            git checkout -f -B main origin/main
            git reset --hard origin/main
            ./deploy.sh
